<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<script>


    //Caso 5: Construya un algoritmo de control de inventario de un almacén que tome una lista
//inicial de referencias en un arreglo, extraiga una sección de artículos prioritarios con slice() y
//permita actualizar el stock central usando asignaciones compuestas (-=, +=); valide con if-else
//anidados si la cantidad resultante entra en estado de desabastecimiento. 

let nuevaListaReferencias;

const listaReferenciasCamisas=  [

{ referencia : 'Cam-001', stock: 50},
{ referencia : 'zap-002', stock: 20},
{ referencia : 'PAN-003', stock: 10},
{ referencia : 'CHA-003', stock: 4},
{ referencia : 'JEAN-003', stock: 1},

]

nuevaListaReferencias = listaReferenciasCamisas.slice(-2);
nuevaListaReferencias[0].stock += 1;
nuevaListaReferencias[1].stock -= 3;



document.write('Referencia: ' + nuevaListaReferencias[0].referencia + 'Stock: ' + nuevaListaReferencias[0].stock);
document.write('<br>');
document.write('Referencia: ' + nuevaListaReferencias[1].referencia + 'Stock: ' + nuevaListaReferencias[1].stock);
document.write('<br>');


for(let i = 0; i<nuevaListaReferencias.length; i++){ 
document.write(nuevaListaReferencias[i].referencia + nuevaListaReferencias[i].stock)

if(nuevaListaReferencias[i].stock <= 0){


    document.write('Estado: AGOTADO');

} else {
    if(nuevaListaReferencias[i].stock <= 5){
        document.write('Estado: DESABASTECIMIENTO');
        document.write('<br>');
    }
    else{
        document.write('Estado: NORMAl');
    }
}




}


    

</script>
</body>
</html>
