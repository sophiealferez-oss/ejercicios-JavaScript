//Programe un selector de promociones aleatorias de tienda online que elija un índice

let productos = ['computador', ' celular', 'Audifonos Inalámbricos', 'Lámparas', ' cargadores'];
indiceAleatorio = Math.floor(Math.random()* productos.length);


let productoNombre = productos[indiceAleatorio];
document.write('Producto seleccionado: ' + productoNombre);
document.write('<br>');

productos.splice(indiceAleatorio, 1);

if(indiceAleatorio === 0){
    document.write('Articulo para despacho sin costo');
} else {

        document.write('Articulo para despacho sin costo');
    } else{
    if(indiceAleatorio === 2){

    } else {

    } else 
    {

    }
    }
    } 

    }
}
